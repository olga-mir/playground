version: "3"

tasks:
  kagent:
    desc: "Port forward kagent"
    cmds:
      - kubectl port-forward -n kagent-system svc/kagent 8082:80

  openfga-proxy:
    desc: "Port forward openfga-mcp-proxy (apps-dev) to localhost:8090"
    cmds:
      - kubectl port-forward -n kagent-system svc/openfga-mcp-proxy 8090:8080 --context gke_${PROJECT_ID}_${ZONE}_apps-dev

  kguardian:
    desc: "Port forward kguardian UI to localhost:5173 (usage: task port-forward:kguardian CLUSTER=control-plane|apps-dev)"
    vars:
      CLUSTER: '{{.CLUSTER | default "apps-dev"}}'
    cmds:
      - kubectl port-forward -n kguardian svc/kguardian-frontend 5173:5173 --context gke_${PROJECT_ID}_${ZONE}_{{.CLUSTER}}

  kguardian-broker:
    desc: "Port forward kguardian broker (for the kubectl kguardian CLI plugin) to localhost:9090 (usage: task port-forward:kguardian-broker CLUSTER=control-plane|apps-dev)"
    vars:
      CLUSTER: '{{.CLUSTER | default "apps-dev"}}'
    cmds:
      - kubectl port-forward -n kguardian svc/kguardian-broker 9090:9090 --context gke_${PROJECT_ID}_${ZONE}_{{.CLUSTER}}

  # https://github.com/christian-posta/scripted-solo-demos/tree/master/agentgateway/kubernetes
  agw:
    desc: "Port forward agent gateway"
    cmds:
      - AGW=$(kubectl get pods -n kgateway-system -l gateway.networking.k8s.io/gateway-name=shared-mcp-kgateway -o jsonpath='{.items[0].metadata.name}') && kubectl port-forward -n kgateway-system $AGW 19000:19000
