apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kguardian-crds
  namespace: flux-system
spec:
  interval: 10m
  timeout: 30m
  path: ./kubernetes/namespaces/base/kguardian/helm
  prune: true
  # wait: false — the kguardian HelmRelease chart pull is currently denied (403)
  # by ghcr.io upstream; waiting here would block platform/tenants indefinitely.
  # kguardian's own HelmRelease keeps retrying independently and can self-heal.
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-config
