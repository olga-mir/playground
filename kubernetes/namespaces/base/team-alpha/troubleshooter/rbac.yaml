apiVersion: v1
kind: ServiceAccount
metadata:
  name: troubleshooter-mcp
  namespace: team-alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: troubleshooter-mcp
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "resourcequotas", "limitranges"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: troubleshooter-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: troubleshooter-mcp
subjects:
  - kind: ServiceAccount
    name: troubleshooter-mcp
    namespace: team-alpha
