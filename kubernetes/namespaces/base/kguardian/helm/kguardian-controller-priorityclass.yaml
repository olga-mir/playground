---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kguardian-controller
value: 1000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: >-
  Host-level eBPF security agent (DaemonSet, one pod per node). Above default
  workload priority (0) so it can preempt best-effort pods for the last bit of
  node capacity, but well below cluster-critical infra (gmp-critical,
  system-cluster-critical, system-node-critical).
