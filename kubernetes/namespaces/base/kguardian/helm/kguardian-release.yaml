---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
  namespace: kguardian
spec:
  interval: 10m
  chart:
    spec:
      chart: kguardian
      version: "1.23.1"
      sourceRef:
        kind: HelmRepository
        name: kguardian-helm-repo
        namespace: kguardian
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    telemetry:
      enabled: false
    controller:
      priorityClassName: kguardian-controller
