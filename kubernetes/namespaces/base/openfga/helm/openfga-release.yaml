apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openfga
  namespace: openfga
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: openfga
      version: "0.3.12"
      sourceRef:
        kind: HelmRepository
        name: openfga
        namespace: openfga
  values:
    datastore:
      engine: memory
    grpc:
      enabled: true
    http:
      enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
