apiVersion: platform.tornado-demo.io/v1alpha1
kind: GKECluster
metadata:
  name: apps-dev-cluster
  namespace: apps-dev
spec:
  parameters:
    clusterName: "${GKE_APPS_DEV_CLUSTER}"
    clusterType: workload
    projectId: "${PROJECT_ID}"
    region: "${REGION}"
    zone: "${ZONE}"
    vpcName: "${GKE_VPC}"
    subnetName: "${APPS_DEV_SUBNET_NAME}"
    machineType: "e2-standard-2"
    minNodes: 2
    maxNodes: 5
    nodePools:
      - name: noisy-node
        machineType: "e2-standard-2"
        minNodes: 1
        maxNodes: 1
        labels:
          workload: noisy-node
        taints:
          - key: dedicated
            value: noisy-node
            effect: NO_SCHEDULE

