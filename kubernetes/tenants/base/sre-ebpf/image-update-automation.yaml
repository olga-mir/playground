apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: experiment-ebpf
  namespace: flux-system
spec:
  interval: 5m
  suspend: true # loop with playground-sre's build-push-ebpf.yml (paths include workloads/ebpf-noisy-neighbour/k8s) — see fix in that repo
  sourceRef:
    kind: GitRepository
    name: playground-sre
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: 'chore: update experiment-ebpf image to {{range .Changed.Changes}}{{.OldValue}} -> {{.NewValue}}{{end}}'
    push:
      branch: main
  update:
    path: ./workloads/ebpf-noisy-neighbour/k8s
    strategy: Setters
