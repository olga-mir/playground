apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sre
  namespace: flux-system
spec:
  interval: 5m
  path: ./workloads/perf-lab/k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: playground-sre
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: platform-config
  dependsOn:
    - name: tenants
